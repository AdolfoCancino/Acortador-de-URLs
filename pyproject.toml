[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acortador-de-urls"
version = "0.1.0"
description = "FastAPI URL shortener with asynchronous Redis Streams analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "asyncpg>=0.30,<1",
  "redis>=5.2,<7",
  "pydantic-settings>=2.7,<3",
  "ua-parser>=1.0,<2",
  "geoip2>=5,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "httpx>=0.28,<1",
  "asgi-lifespan>=2.1,<3",
  "testcontainers[postgres,redis]>=4.9,<5",
  "psycopg2-binary>=2.9,<3",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL 16 and Redis 7 containers"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
